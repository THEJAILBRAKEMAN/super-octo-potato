{% extends "base.html" %}

{% block title %}Delete Post - The Hive{% endblock %}

{% block content %}
<section class="page-content">
    <div class="container">
        <div class="forum-card">
            <h1 class="page-title">Delete Post</h1>
            <p>Are you sure you want to delete "{{ post.title }}"?</p>
            <form method="post">
                {% csrf_token %}
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Yes, delete</button>
                    <a href="{% url 'forum_detail' post.pk %}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
